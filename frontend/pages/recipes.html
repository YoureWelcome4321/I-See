<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b572b" />
  <meta name="description" content="Рецепты без продуктов, которые вы указали в профиле." />
  <title>Рецепты для вас — Я Вижу!</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/ui.css?v=5" />
  <style>
    .recipe-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .recipe-card { min-width: 0; overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 26px; background: #fff; transition: transform .2s, box-shadow .2s; }
    .recipe-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
    .recipe-card img { width: 100%; aspect-ratio: 4 / 3; display: block; object-fit: cover; }
    .recipe-card-body { padding: 16px 18px 18px; display: flex; flex: 1; flex-direction: column; gap: 8px; }
    .recipe-card h2 { margin: 0; font-size: 1.1rem; line-height: 1.25; }
    .recipe-card p { margin: 0; color: var(--muted); font-size: .88rem; line-height: 1.45; }
    .recipe-card small { color: var(--amber-ink); font-weight: 700; }
    .recipe-card .ui-btn { margin-top: auto; }
    .recipe-card p + .ui-btn, .recipe-card h2 + .ui-btn { margin-top: 10px; }
    @media (max-width: 900px) { .recipe-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) { .recipe-grid { grid-template-columns: 1fr; gap: 12px; } .recipe-card { border-radius: 22px; } }
  </style>
</head>
<body>
  <header class="hm-top">
    <div class="hm-bar">
      <a class="hm-brand" href="/" aria-label="Я Вижу! — главная"><img class="hm-mark" src="/assets/images/logo.png" alt="" aria-hidden="true" /><span>Я Вижу!</span></a>
      <a class="hm-profile" href="/medical-card.html"><i aria-hidden="true"><svg viewBox="0 0 32 32" focusable="false"><circle cx="16" cy="10" r="5.5" /><path d="M5.5 27c.8-6.1 4.7-9.3 10.5-9.3s9.7 3.2 10.5 9.3" /></svg></i><span>Профиль</span><span aria-hidden="true">›</span></a>
    </div>
    <div class="hm-head">
      <a class="hm-back" href="/" aria-label="На главную"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6" /></svg></a>
      <div class="hm-head-copy">
        <p class="hm-kicker">Подборка</p>
        <h1 id="page-title">Рецепты для вас</h1>
        <p class="hm-sub">Мы убираем блюда с ингредиентами, которые вы указали в профиле.</p>
      </div>
    </div>
  </header>

  <main class="hm-main" id="main-content">
    <div class="hm-wrap">
      <p class="ui-status" id="recipe-status" aria-live="polite">Загружаем рецепты…</p>
      <section class="recipe-grid" id="recipe-grid" aria-label="Рецепты"></section>
    </div>
  </main>
  <script src="/assets/js/api.js?v=4" defer></script>
  <script src="/assets/js/recipes.js?v=3" defer></script>
</body>
</html>
