<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b572b" />
  <meta name="description" content="Ингредиенты и шаги приготовления рецепта." />
  <title>Рецепт — Я Вижу!</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/ui.css?v=2" />
  <style>
    .recipe-wrap { width: min(760px, calc(100% - 32px)); }
    #recipe { display: grid; gap: 18px; }
    #recipe > p { margin: 0; color: var(--muted); }
    .recipe-hero { overflow: hidden; border-radius: 32px; background: #fff; box-shadow: var(--shadow-card); }
    .recipe-hero img { width: 100%; height: clamp(200px, 40vw, 320px); display: block; object-fit: cover; }
    .recipe-copy { padding: 24px 26px 26px; }
    .recipe-copy h1 { margin: 0 0 10px; font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.08; }
    .recipe-copy p { margin: 0; color: var(--muted); font-size: 1.02rem; line-height: 1.55; }
    .recipe-ad { width: fit-content; margin-top: 16px; padding: .45rem .8rem; border-radius: 999px; background: var(--lime); color: var(--deep); font-size: .75rem; font-weight: 900; letter-spacing: .05em; }
    .recipe-section { padding: 24px 26px; border: 1px solid var(--line); border-radius: 26px; background: #fff; }
    .recipe-section h2 { margin: 0 0 14px; font-size: 1.35rem; }
    .recipe-section ul, .recipe-section ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
    .recipe-section li { padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; border-radius: 16px; background: var(--soft); line-height: 1.45; }
    .recipe-section ul li::before { content: ""; width: 9px; height: 9px; margin-top: .45em; flex: none; border-radius: 50%; background: var(--bright); }
    .recipe-section ol { counter-reset: step; }
    .recipe-section ol li::before { counter-increment: step; content: counter(step); width: 1.8rem; height: 1.8rem; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--lime); color: var(--deep); font: 800 .9rem Manrope, sans-serif; }
    @media (max-width: 560px) { .recipe-copy, .recipe-section { padding: 18px 16px; } .recipe-hero { border-radius: 26px; } .recipe-section { border-radius: 22px; } }
  </style>
</head>
<body>
  <header class="hm-top">
    <div class="hm-bar">
      <a class="hm-brand" href="/" aria-label="Я Вижу! — главная"><img class="hm-mark" src="/assets/images/logo.png" alt="" aria-hidden="true" /><span>Я Вижу!</span></a>
      <a class="hm-profile" href="/medical-card.html"><i aria-hidden="true"><svg viewBox="0 0 32 32" focusable="false"><circle cx="16" cy="10" r="5.5" /><path d="M5.5 27c.8-6.1 4.7-9.3 10.5-9.3s9.7 3.2 10.5 9.3" /></svg></i><span>Профиль</span><span aria-hidden="true">›</span></a>
    </div>
    <div class="hm-head">
      <a class="hm-back" href="/recipes.html" aria-label="Ко всем рецептам"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6" /></svg></a>
      <div class="hm-head-copy">
        <p class="hm-kicker">Рецепты для вас</p>
        <p class="hm-title">Рецепт</p>
      </div>
    </div>
  </header>

  <main class="hm-main" id="main-content">
    <div class="hm-wrap recipe-wrap">
      <article id="recipe" aria-live="polite"><p>Загружаем рецепт…</p></article>
    </div>
  </main>
  <script src="/assets/js/recipe.js?v=2" defer></script>
</body>
</html>
