<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#185e31" />
  <meta name="description" content="Личная карточка питания: аллергии и продукты, которые вы не едите." />
  <title>Профиль — Я Вижу!</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <script>try { if (!localStorage.getItem('ya-vizhu-demo-token-v1')) location.replace('/login.html?next=/medical-card.html'); } catch {}</script>
  <link rel="stylesheet" href="/assets/css/ui.css?v=5" />
  <style>
    /* Профиль для старшего поколения: одна колонка, крупный текст, по одному действию в карточке. */
    .profile { width: min(720px, calc(100% - 32px)); margin: 0 auto; display: grid; gap: 20px; }
    .profile .ui-card { display: grid; gap: 16px; }
    .profile .ui-card-head { margin: 0; }
    .profile .ui-card-head h2 { font-size: 1.5rem; }
    .profile .ui-text { font-size: 1.06rem; color: #4d5d50; }
    .profile .ui-field { font-size: 1rem; }
    .profile .ui-field input { min-height: 3.6rem; font-size: 1.12rem; }
    .profile .ui-btn { min-height: 3.6rem; font-size: 1.06rem; }
    .profile .ui-status { font-size: 1rem; color: var(--green); font-weight: 700; }
    .profile .ui-status:empty { display: none; }

    .profile-hello { display: flex; align-items: center; gap: 16px; }
    .profile-avatar { width: 4rem; height: 4rem; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--lime); color: var(--deep); font: 800 1.7rem Manrope, sans-serif; }
    .profile-hello h2 { margin: 0; font-size: 1.6rem; line-height: 1.2; overflow-wrap: anywhere; }
    .profile-hello p { margin: 4px 0 0; color: var(--muted); font-size: 1.06rem; }

    .profile-add { display: grid; gap: 12px; }
    .profile-add-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .profile-items { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
    .profile-item { padding: 12px 12px 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--line); border-radius: 18px; background: var(--soft); font-size: 1.12rem; font-weight: 700; }
    .profile-item small { display: block; margin-bottom: 2px; color: var(--green); font-size: .82rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
    .profile-item.is-allergy small { color: var(--danger); }
    .profile-item span { min-width: 0; overflow-wrap: anywhere; }
    .profile-empty { padding: 18px; border: 2px dashed var(--line-strong); border-radius: 18px; color: var(--muted); font-size: 1.06rem; text-align: center; }

    .profile-size { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .profile-size button { min-height: 3.6rem; border: 2px solid var(--line); border-radius: 18px; background: #fff; color: var(--ink); font-weight: 800; cursor: pointer; }
    .profile-size button[aria-pressed="true"] { border-color: var(--green); background: var(--tint); color: var(--deep); }
    .profile-size button:last-child { font-size: 1.25rem; }
    .profile-logout { justify-self: start; }

    @media (max-width: 560px) {
      .profile { width: calc(100% - 24px); gap: 16px; }
      .profile-add-buttons { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="medical-card-page">
<header class="hm-top">
    <div class="hm-bar">
      <a class="hm-brand" href="/" aria-label="Я Вижу! — главная"><img class="hm-mark" src="/assets/images/logo.png" alt="" aria-hidden="true" /><span>Я Вижу!</span></a>
      <a class="hm-profile" href="/medical-card.html" aria-current="page"><i aria-hidden="true"><svg viewBox="0 0 32 32" focusable="false"><circle cx="16" cy="10" r="5.5" /><path d="M5.5 27c.8-6.1 4.7-9.3 10.5-9.3s9.7 3.2 10.5 9.3" /></svg></i><span>Профиль</span><span aria-hidden="true">›</span></a>
    </div>
    <div class="hm-head">
      <a class="hm-back" href="/" aria-label="На главную"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6" /></svg></a>
      <div class="hm-head-copy">
        <p class="hm-kicker">Личный профиль</p>
        <h1 id="page-title">Мой профиль</h1>
        <p class="hm-sub">Ваши ограничения в питании и удобный размер текста.</p>
      </div>
    </div>
  </header>

  <main class="hm-main">
    <div class="profile">
      <section class="ui-card" id="account-card" aria-labelledby="account-name">
        <div class="profile-hello">
          <span class="profile-avatar" id="account-initial" aria-hidden="true"></span>
          <div><h2 id="account-name"></h2><p id="account-phone"></p></div>
        </div>
      </section>

      <section class="ui-card" aria-labelledby="medical-title">
        <div class="ui-card-head"><span class="ui-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"></path><path d="M10.3 3.9 2.6 17.5A2 2 0 0 0 4.3 20.5h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path></svg></span><h2 id="medical-title">Что мне нельзя</h2></div>
        <p class="ui-text">Мы предупредим, если найдём эти продукты в составе.</p>
        <ul class="profile-items" id="medical-list" aria-label="Мои аллергии и продукты, которые я не ем"></ul>
        <form class="profile-add" id="medical-form">
          <label class="ui-field" for="food-name">Добавить продукт<input id="food-name" name="food" type="text" maxlength="80" placeholder="Например, арахис" autocomplete="off" /></label>
          <div class="profile-add-buttons">
            <button class="ui-btn" type="submit" name="type" value="allergy"><span>У меня аллергия</span></button>
            <button class="ui-btn ui-btn--ghost" type="submit" name="type" value="avoid"><span>Я это не ем</span></button>
          </div>
        </form>
        <p class="ui-status" id="medical-status" role="status"></p>
      </section>

      <section class="ui-card" aria-labelledby="size-title">
        <div class="ui-card-head"><span class="ui-icon" aria-hidden="true">Аа</span><h2 id="size-title">Размер текста</h2></div>
        <div class="profile-size" role="group" aria-labelledby="size-title">
          <button type="button" data-font-size="normal" aria-pressed="true">Обычный</button>
          <button type="button" data-font-size="large" aria-pressed="false">Крупный</button>
        </div>
      </section>

      <button class="ui-btn ui-btn--danger profile-logout" id="logout-button" type="button"><span aria-hidden="true">↩</span> Выйти из профиля</button>
    </div>
  </main>

  <script src="../assets/js/api.js" defer></script>
  <script src="../assets/js/medical-card.js?v=4" defer></script>
</body>
</html>
