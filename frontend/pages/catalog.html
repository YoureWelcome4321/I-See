<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b572b" />
  <meta name="description" content="Подборка продуктов и информация об их составе от Я Вижу!." />
  <title>Товары для вас — Я Вижу!</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/ui.css?v=5" />
  <style>
    :root {
      --deep: #0b572b; --green: #218638; --bright: #63b83f; --lime: #d9f05b;
      --ink: #17251a; --muted: #68746b; --line: #e4ebe0; --page: #f3f4f1; --soft: #f8fbf5;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-height: 100vh; background: var(--page); color: var(--ink);
      font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { font-family: Manrope, "DM Sans", sans-serif; letter-spacing: -.03em; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }

    /* ---------- Сканер-плашка ---------- */
    .scan-bar {
      min-height: 80px; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
      border: 1px solid #e6ece3; border-radius: 26px; background: #fff;
    }
    .scan-bar-copy { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .scan-icon { width: 46px; height: 46px; flex: none; display: grid; place-items: center; border-radius: 50%; background: #e7f3dd; }
    .scan-icon svg { width: 23px; height: 23px; fill: none; stroke: var(--green); stroke-width: 2; stroke-linecap: round; }
    .scan-bar h2 { color: var(--deep); font-size: 16px; line-height: 1.3; }
    .scan-link {
      min-height: 42px; flex: none; padding: 6px 8px 6px 16px; display: inline-flex; align-items: center; gap: 10px;
      border: 1px solid #dfe9d8; border-radius: 999px; background: var(--soft); color: var(--deep); font-size: 13px; font-weight: 800; transition: background .15s;
    }
    .scan-link:hover { background: #edf6e6; }
    .scan-link i { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 50%; background: var(--lime); font-style: normal; font-size: 16px; }

    /* ---------- Заголовок и поиск ---------- */
    .section { padding: 0; }

    .search {
      position: relative; margin-bottom: 14px; display: flex; align-items: center;
      border: 1.5px solid var(--line); border-radius: 999px; background: #fff; box-shadow: 0 8px 22px rgb(31 67 36 / 6%);
      transition: border-color .15s, box-shadow .15s;
    }
    .search:focus-within { border-color: var(--bright); box-shadow: 0 0 0 4px rgb(217 240 91 / 60%); }
    .search-icon { width: 54px; flex: none; display: grid; place-items: center; color: var(--green); }
    .search-icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
    .search input { flex: 1; min-width: 0; height: 58px; padding: 0 6px 0 0; border: 0; background: transparent; color: var(--ink); font-size: 16px; outline: 0; }
    .search input::placeholder { color: #8f9b91; }
    .search input::-webkit-search-cancel-button { display: none; }
    .clear { width: 38px; height: 38px; margin-right: 10px; border: 0; border-radius: 50%; background: #eef5e8; color: var(--deep); font-size: 20px; line-height: 1; cursor: pointer; }
    .clear:hover { background: var(--lime); }

    .chips { margin-bottom: 18px; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; min-height: 40px; padding: 8px 16px; border: 1.5px solid var(--line); border-radius: 999px; background: #fff;
      color: #405544; font-size: 13px; font-weight: 800; cursor: pointer; transition: all .15s;
    }
    .chip:hover { border-color: #c5d9bb; }
    .chip[aria-pressed="true"] { border-color: var(--green); background: var(--green); color: #fff; }

    .diet-note { margin-bottom: 14px; padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; border: 1.5px solid #d6e9a6; border-radius: 20px; background: #f4fadf; color: #2c4a1e; font-size: 1rem; font-weight: 600; line-height: 1.45; }
    .diet-note p { margin: 0; flex: 1 1 260px; }
    .diet-note button { min-height: 2.75rem; padding: .4rem 1.1rem; border: 1.5px solid #c9dfa0; border-radius: 999px; background: #fff; color: var(--deep, #0b572b); font: inherit; font-weight: 800; cursor: pointer; }
    .card .diet-ban { margin: 0 0 8px; padding: 6px 10px; border-radius: 12px; background: #fdecea; color: #a0271a; font-size: .9rem; font-weight: 800; }
    .status { min-height: 20px; margin-bottom: 14px; color: var(--muted); font-size: 14px; }

    /* ---------- Карточки ---------- */
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 17px; }
    .card {
      min-width: 0; overflow: hidden; display: flex; flex-direction: column;
      border: 1px solid var(--line); border-radius: 27px; background: #fff;
      transition: transform .2s, box-shadow .2s; animation: rise .45s ease both;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 16px 34px rgb(31 67 36 / 10%); }
    .art { position: relative; min-height: 166px; display: grid; place-items: center; background: linear-gradient(145deg, #f1f8e9, #e3f1d7); }
    .art.t1 { background: linear-gradient(145deg, #f5f7e8, #eaf0ce); }
    .art.t2 { background: linear-gradient(145deg, #eef7e7, #d9efc9); }
    .art.t3 { background: linear-gradient(145deg, #f0f8ee, #d6ecd0); }
    .cat {
      position: absolute; top: 14px; left: 14px; max-width: calc(100% - 28px); padding: 7px 11px; overflow: hidden;
      border: 1px solid rgb(255 255 255 / 80%); border-radius: 999px; background: rgb(255 255 255 / 80%);
      color: #426448; font-size: 10px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap;
    }
    .mark {
      width: 90px; height: 90px; display: grid; place-items: center; border: 1px solid #d7e8cc; border-radius: 30px;
      transform: rotate(-6deg); background: #fff; color: var(--green); font: 800 46px Manrope, sans-serif; transition: transform .25s;
    }
    .card:hover .mark { transform: rotate(4deg) scale(1.06); }
    .spark { position: absolute; top: 28px; right: 29px; color: #6cb947; font-size: 26px; }
    .body { padding: 18px; display: flex; flex: 1; flex-direction: column; }
    .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 9px; }
    .row h3 { font-size: 18px; line-height: 1.22; }
    .price { flex: none; padding: 5px 9px; border-radius: 999px; background: #eff7e9; color: var(--deep); font-size: 12px; font-weight: 900; white-space: nowrap; }
    .body p { margin-top: 12px; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
    .body p.warn { color: #547348; }
    .body p.warn b { color: #8a5a1f; }
    .open {
      width: 100%; min-height: 46px; margin-top: auto; padding: 8px 8px 8px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      border: 1px solid #dfe9d8; border-radius: 999px; background: var(--soft); color: var(--deep); font-size: 13px; font-weight: 850; cursor: pointer; transition: background .15s;
    }
    .body p + .open, .body .gap { margin-top: 18px; }
    .open:hover { background: #edf6e6; }
    .open i { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--lime); font-style: normal; font-size: 16px; }
    mark { padding: 0 2px; border-radius: 5px; background: var(--lime); color: var(--deep); }

    /* Пусто */
    .empty {
      padding: 46px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
      border: 2px dashed #d3e4c8; border-radius: 27px; background: #fff; color: var(--muted);
    }
    .empty svg { width: 54px; height: 54px; fill: none; stroke: var(--bright); stroke-width: 1.7; stroke-linecap: round; }
    .empty b { color: var(--ink); font: 800 20px Manrope, sans-serif; }
    .empty button { margin-top: 6px; min-height: 44px; padding: 8px 20px; border: 1px solid #dce8d5; border-radius: 999px; background: var(--soft); color: var(--deep); font-weight: 800; cursor: pointer; }

    /* Кнопка «Показать ещё» */
    .more-wrap { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .more {
      min-width: min(100%, 340px); min-height: 58px; padding: 8px 9px 8px 26px; display: flex; align-items: center; justify-content: space-between; gap: 14px;
      border: 0; border-radius: 999px; background: linear-gradient(110deg, #6cc044, #2f9c3c); color: #fff;
      font-size: 15.5px; font-weight: 800; cursor: pointer; box-shadow: 0 5px 0 #2a8335, 0 12px 22px rgb(47 156 60 / 22%); transition: transform .16s, box-shadow .16s;
    }
    .more:hover { transform: translateY(-2px); }
    .more:active { transform: translateY(3px); box-shadow: 0 2px 0 #2a8335; }
    .more i { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; background: var(--lime); color: var(--deep); font-style: normal; font-size: 20px; font-weight: 800; }
    .more-hint { color: var(--muted); font-size: 13px; }
    .progress { width: min(340px, 100%); height: 6px; overflow: hidden; border-radius: 99px; background: #dfead6; }
    .progress span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--bright), var(--lime)); transition: width .3s; }


    /* ---------- Окно состава ---------- */
    dialog { width: min(520px, calc(100% - 28px)); max-height: calc(100dvh - 28px); padding: 0; border: 0; border-radius: 30px; background: #fff; color: var(--ink); box-shadow: 0 30px 80px rgb(8 40 18 / 35%); }
    dialog::backdrop { background: rgb(12 47 25 / 60%); backdrop-filter: blur(4px); }
    dialog[open] { animation: rise .3s ease both; }
    .dlg-top { position: relative; padding: 26px 26px 20px; background: linear-gradient(135deg, #e7f3db, #d3ebbd); }
    .dlg-top .mark { width: 70px; height: 70px; margin-bottom: 14px; border-radius: 24px; font-size: 36px; }
    .dlg-top h2 { padding-right: 44px; font-size: 26px; line-height: 1.15; }
    .dlg-meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; }
    .dlg-meta span { padding: 6px 12px; border-radius: 999px; background: rgb(255 255 255 / 75%); color: var(--deep); font-size: 12px; font-weight: 800; }
    .dlg-close { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: #fff; color: var(--deep); font-size: 24px; line-height: 1; cursor: pointer; }
    .dlg-close:hover { background: var(--lime); }
    .dlg-body { padding: 22px 26px 26px; display: grid; gap: 18px; overflow: auto; }
    .dlg-body h3 { margin-bottom: 9px; color: var(--green); font: 900 10.5px "DM Sans", sans-serif; letter-spacing: .14em; text-transform: uppercase; }
    .tags { display: flex; flex-wrap: wrap; gap: 7px; }
    .tags span { padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--soft); font-size: 13px; font-weight: 600; }
    .tags.alert span { border-color: #f0dcae; background: #fff6dc; color: #7a5712; font-weight: 800; }
    .tags.ok span { border-color: #cfe6c1; background: #eaf6df; color: var(--deep); font-weight: 800; }
    .dlg-actions { display: grid; grid-template-columns: 1fr; }
    .dlg-actions a {
      min-height: 52px; padding: 8px 10px 8px 22px; display: flex; align-items: center; justify-content: space-between;
      border-radius: 999px; background: linear-gradient(110deg, #6cc044, #2f9c3c); color: #fff; font-weight: 800; box-shadow: 0 4px 0 #2a8335;
    }
    .dlg-actions i { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: var(--lime); color: var(--deep); font-style: normal; font-size: 18px; }

    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

    /* ---------- Адаптив ---------- */
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) {
      .scan-bar { padding: 12px; border-radius: 22px; } .scan-icon { width: 38px; height: 38px; } .scan-bar h2 { font-size: 13px; }
      .scan-link { padding-left: 12px; font-size: 12px; gap: 6px; }

      .search input { height: 52px; font-size: 15px; } .search-icon { width: 48px; }
      .grid { grid-template-columns: 1fr; gap: 12px; }
      .card { display: grid; grid-template-columns: 112px minmax(0, 1fr); border-radius: 22px; }
      .art { min-height: 100%; } .cat { top: 8px; left: 7px; max-width: calc(100% - 14px); padding: 5px 7px; font-size: 8px; }
      .mark { width: 60px; height: 60px; border-radius: 21px; font-size: 31px; } .spark { top: 24px; right: 11px; font-size: 19px; }
      .body { padding: 13px 12px; } .row h3 { font-size: 15px; } .price { font-size: 10px; padding: 4px 7px; }
      .body p { margin-top: 7px; font-size: 11px; } .open { min-height: 38px; font-size: 11px; padding-left: 11px; } .open i { width: 25px; height: 25px; }
      .body p + .open { margin-top: 10px; }
      .dlg-top { padding: 22px 18px 16px; } .dlg-body { padding: 18px; }
    }
  </style>
</head>

        { n: "Рис круглозёрный", c: "Крупы и макароны", p: 96, i: ["рис"], a: [] },
        { n: "Овсяные хлопья", c: "Крупы и макароны", p: 84, i: ["овсяные хлопья"], a: ["овёс", "глютен"] },
        { n: "Спагетти", c: "Крупы и макароны", p: 79, i: ["мука из твёрдой пшеницы", "вода"], a: ["пшеница", "глютен"] },

        { n: "Сок яблочный", c: "Напитки", p: 119, i: ["яблочный сок"], a: [] },
        { n: "Сок апельсиновый", c: "Напитки", p: 129, i: ["апельсиновый сок"], a: [] },
        { n: "Чай зелёный", c: "Напитки", p: 139, i: ["зелёный чай", "лепестки жасмина"], a: [] },
        { n: "Лимонад лимон-мята", c: "Напитки", p: 85, i: ["вода", "сахар", "лимонный сок", "мята", "лимонная кислота"], a: [] },

        { n: "Арахис жареный", c: "Орехи и снеки", p: 109, i: ["арахис", "соль"], a: ["арахис"] },
        { n: "Чипсы картофельные", c: "Орехи и снеки", p: 119, i: ["картофель", "подсолнечное масло", "соль"], a: [] },
        { n: "Миндаль сушёный", c: "Орехи и снеки", p: 249, i: ["миндаль"], a: ["миндаль", "орехи"] },

        { n: "Колбаса варёная", c: "Мясо и рыба", p: 219, i: ["говядина", "свинина", "молоко", "соль", "специи"], a: ["молоко"] },
        { n: "Филе куриное", c: "Мясо и рыба", p: 299, i: ["куриное филе"], a: [] },
        { n: "Горбуша консервированная", c: "Мясо и рыба", p: 135, i: ["горбуша", "масло", "соль"], a: ["рыба"] }
      ];

      var PAGE = 9;
      var state = { q: "", cat: "Все", visible: PAGE, showAll: false };
      // Products this person can't eat, by index: filled from /api/diet/check after sign-in.
      var banned = {};
      PRODUCTS.forEach(function (p, idx) { p.id = idx; });
      var $ = function (id) { return document.getElementById(id); };
      var grid = $("grid"), search = $("search"), clearBtn = $("clear"), chips = $("chips");
      var dlg = $("dlg");

      function norm(s) { return String(s).toLowerCase().replace(/ё/g, "е").trim(); }
      function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
      function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
      function priceText(p) { return p + " ₽"; }

      function highlight(name, q) {
        if (!q) return esc(name);
        var i = norm(name).indexOf(norm(q));
        if (i < 0) return esc(name);
        var l = norm(q).length;
        return esc(name.slice(0, i)) + "<mark>" + esc(name.slice(i, i + l)) + "</mark>" + esc(name.slice(i + l));
      }

      function filtered() {
        var q = norm(state.q);
        return PRODUCTS.filter(function (p) {
          return (state.showAll || !banned[p.id]) && (state.cat === "Все" || p.c === state.cat) && (!q || norm(p.n).indexOf(q) !== -1);
        });
      }

      function cardHTML(p, k) {
        var warn = p.a.length
          ? '<p class="warn"><b>Аллергены:</b> ' + esc(p.a.join(", ")) + "</p>"
          : '<p class="warn">Аллергены не указаны</p>';
        return '<article class="card" style="animation-delay:' + ((k % PAGE) * 40) + 'ms">' +
          '<div class="art t' + (p.id % 4) + '"><span class="cat">' + esc(p.c) + '</span>' +
          '<span class="mark" aria-hidden="true">' + esc(p.n.charAt(0).toUpperCase()) + '</span><span class="spark" aria-hidden="true">✦</span></div>' +
          '<div class="body"><div class="row"><h3>' + highlight(p.n, state.q) + '</h3><span class="price">' + priceText(p.p) + "</span></div>" +
          (banned[p.id] ? '<p class="diet-ban">Вам нельзя: ' + esc(banned[p.id].join(", ")) + "</p>" : "") +
          '<p>Состав: ' + esc(p.i.slice(0, 3).join(", ")) + (p.i.length > 3 ? "…" : "") + "</p>" + warn +
          '<button class="open" type="button" data-id="' + p.id + '"><span>Открыть состав</span><i aria-hidden="true">→</i></button></div></article>';
      }

      function render(append) {
        var list = filtered(), shown = Math.min(state.visible, list.length);
        $("count").textContent = list.length;

        if (!list.length) {
          grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5M8.5 11h5"></path></svg>' +
            '<b>Ничего не нашлось</b><span>Проверьте написание или выберите другую категорию.</span><button type="button" id="reset">Сбросить поиск</button></div>';
          $("status").textContent = "";
          $("more-wrap").hidden = true;
          return;
        }

        var from = append ? grid.querySelectorAll(".card").length : 0;
        if (!append) grid.innerHTML = "";
        grid.insertAdjacentHTML("beforeend", list.slice(from, shown).map(function (p, k) { return cardHTML(p, k); }).join(""));

        $("status").textContent = state.q || state.cat !== "Все"
          ? "Найдено: " + list.length + " · показано " + shown
          : "Показано " + shown + " из " + list.length;

        var left = list.length - shown;
        $("more-wrap").hidden = left <= 0;
        if (left > 0) {
          $("more-text").textContent = "Показать ещё " + Math.min(PAGE, left);
          $("more-hint").textContent = "Осталось ещё " + left + " " + plural(left);
          $("progress").style.width = Math.round(shown / list.length * 100) + "%";
        }
      }

      function plural(n) {
        var m = n % 10, h = n % 100;
        if (m === 1 && h !== 11) return "товар";
        if (m >= 2 && m <= 4 && (h < 12 || h > 14)) return "товара";
        return "товаров";
      }

      function buildChips() {
        var cats = ["Все"];
        // A category whose products are all unsuitable would only lead to "nothing found".
        PRODUCTS.forEach(function (p) { if ((state.showAll || !banned[p.id]) && cats.indexOf(p.c) < 0) cats.push(p.c); });
        if (cats.indexOf(state.cat) < 0) state.cat = "Все";
        chips.innerHTML = cats.map(function (c) {
          return '<button class="chip" type="button" data-cat="' + esc(c) + '" aria-pressed="' + (c === state.cat) + '">' + esc(c) + "</button>";
        }).join("");
      }

      function openDialog(id) {
        var p = PRODUCTS[id]; if (!p) return;
        $("dlg-mark").textContent = p.n.charAt(0).toUpperCase();
        $("dlg-title").textContent = p.n;
        $("dlg-meta").innerHTML = "<span>" + esc(p.c) + "</span><span>" + priceText(p.p) + "</span>";
        $("dlg-ingredients").innerHTML = p.i.map(function (x) { return "<span>" + esc(cap(x)) + "</span>"; }).join("");
        $("dlg-allergens").className = "tags " + (p.a.length ? "alert" : "ok");
        $("dlg-allergens").innerHTML = p.a.length
          ? p.a.map(function (x) { return "<span>" + esc(cap(x)) + "</span>"; }).join("")
          : "<span>Аллергены не указаны</span>";
        if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
      }

      search.addEventListener("input", function () {
        state.q = search.value; state.visible = PAGE;
        clearBtn.hidden = !search.value;
        render(false);
      });
      clearBtn.addEventListener("click", function () { search.value = ""; state.q = ""; state.visible = PAGE; clearBtn.hidden = true; render(false); search.focus(); });
      chips.addEventListener("click", function (e) {
        var b = e.target.closest(".chip"); if (!b) return;
        state.cat = b.getAttribute("data-cat"); state.visible = PAGE; buildChips(); render(false);
      });
      $("more").addEventListener("click", function () { state.visible += PAGE; render(true); });
      grid.addEventListener("click", function (e) {
        var o = e.target.closest(".open"); if (o) return openDialog(+o.getAttribute("data-id"));
        if (e.target.id === "reset") { search.value = ""; state.q = ""; state.cat = "Все"; state.visible = PAGE; clearBtn.hidden = true; buildChips(); render(false); }
      });
      $("dlg-close").addEventListener("click", function () { dlg.close(); });
      dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });

      function productWord(n) {
        var m = n % 10, h = n % 100;
        if (m === 1 && h !== 11) return "товар";
        if (m >= 2 && m <= 4 && (h < 12 || h > 14)) return "товара";
        return "товаров";
      }

      function showDietNote(restrictions, pending) {
        var ids = Object.keys(banned), note = $("diet-note"), toggle = $("diet-toggle");
        var found = [];
        ids.forEach(function (id) { banned[id].forEach(function (x) { if (found.indexOf(x) < 0) found.push(x); }); });
        var text = ids.length
          ? "Мы убрали " + ids.length + " " + productWord(ids.length) + ", которые вам нельзя: в них есть " + found.join(", ") + "."
          : "Мы проверили товары по вашему списку «" + restrictions.join(", ") + "» — всё, что ниже, вам подходит.";
        if (pending) text += " Нейросеть ещё уточняет состав — список может немного измениться.";
        $("diet-note-text").textContent = text;
        toggle.hidden = !ids.length;
        toggle.textContent = state.showAll ? "Скрыть неподходящие" : "Показать все";
        note.hidden = false;
      }

      // Hides what clashes with the profile: word rules answer at once, the neural network a bit later.
      function checkDiet(attempt) {
        if (!window.YaVizhuAPI || !YaVizhuAPI.hasToken()) { if (attempt === 0) render(false); return; }
        var items = PRODUCTS.map(function (p) { return { id: String(p.id), text: p.n + ": " + p.i.join(", ") + (p.a.length ? "; аллергены: " + p.a.join(", ") : "") }; });
        YaVizhuAPI.request("/api/diet/check", { method: "POST", body: JSON.stringify({ items: items }) }).then(function (data) {
          if (!data.restrictions.length) { render(false); return; }
          banned = {};
          Object.keys(data.results).forEach(function (id) { if (data.results[id].length) banned[id] = data.results[id]; });
          showDietNote(data.restrictions, data.ai === "pending");
          buildChips();
          render(false);
          if (data.ai === "pending" && attempt < 8) setTimeout(function () { checkDiet(attempt + 1); }, 4000);
        }).catch(function () { render(false); /* the catalog still works without the check */ });
      }

      $("diet-toggle").addEventListener("click", function () {
        state.showAll = !state.showAll; state.visible = PAGE;
        $("diet-toggle").textContent = state.showAll ? "Скрыть неподходящие" : "Показать все";
        buildChips();
        render(false);
      });

      buildChips();
      // A signed-in person never sees, even for a moment, a product they can't eat: wait for the check.
      var signedIn = false;
      try { signedIn = Boolean(localStorage.getItem("ya-vizhu-demo-token-v1")); } catch (e) {}
      if (signedIn) $("status").textContent = "Подбираем товары под ваш профиль…"; else render(false);
      // api.js is deferred and loads after this inline script.
      document.addEventListener("DOMContentLoaded", function () { checkDiet(0); });
    })();
  </script>
</body>
</html>
